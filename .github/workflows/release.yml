name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          tar -czf "release/scratch-${version}-web.tar.gz" dist server package.json package-lock.json
          gh release create "v${version}" \
            --draft \
            --title "Scratch v${version}" \
            --notes "Web build. Unpack, then run \`npm ci --omit=dev\` and \`npm start\`. The server listens on 127.0.0.1:4173." \
            "release/scratch-${version}-web.tar.gz"
